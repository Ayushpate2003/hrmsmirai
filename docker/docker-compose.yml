version: "3.8" # Updated version
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: >
      bash -lc '
      if [ -f /workspace/init.sh ]; then
        bash /workspace/init.sh;
      elif [ -f /workspace/docker/init.sh ]; then
        bash /workspace/docker/init.sh;
      else
        echo "[startup] init script not found in mounted workspace.";
        echo "[startup] looked for /workspace/init.sh and /workspace/docker/init.sh";
        echo "[startup] workspace listing:";
        ls -la /workspace;
        echo "[startup] falling back to remote init.sh download";
        curl -fsSL https://raw.githubusercontent.com/frappe/hrms/develop/docker/init.sh -o /tmp/init.sh;
        chmod +x /tmp/init.sh;
        bash /tmp/init.sh;
      fi
      '
    environment:
      - SHELL=/bin/bash
    working_dir: /home/frappe
    volumes:
      - .:/workspace
    ports:
      - 8000:8000
      - 9000:9000

volumes:
  mariadb-data:
